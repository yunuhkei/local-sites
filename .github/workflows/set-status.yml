name: Update a lead's status

on:
  workflow_dispatch:
    inputs:
      lead_id:
        description: "Lead id (first column of data/leads.csv, like osm-node-123)"
        required: true
      status:
        description: "New status"
        required: true
        type: choice
        options: [new, contacted, interested, paid, not interested]
      note:
        description: "Optional note"
        required: false

permissions:
  contents: write

concurrency:
  group: leads
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change status
        env:
          LEAD_ID: ${{ inputs.lead_id }}
          STATUS: ${{ inputs.status }}
          NOTE: ${{ inputs.note }}
        run: python3 leadfinder/tracker.py set "$LEAD_ID" "$STATUS" --note "$NOTE"
      - name: Save
        run: |
          git config user.name "lead-finder-bot"
          git config user.email "lead-finder-bot@users.noreply.github.com"
          git add data/leads.csv
          git commit -m "Update lead status" && git push

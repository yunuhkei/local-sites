name: Weekly lead finder

on:
  schedule:
    - cron: "0 14 * * 1"      # every Monday ~8-9am Milwaukee time
  workflow_dispatch:           # lets you tap "Run workflow" from your phone

permissions:
  contents: write

concurrency:
  group: leads
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find new businesses without a website
        id: find
        run: python3 leadfinder/find_leads.py
      - name: Save the updated spreadsheet
        run: |
          git config user.name "lead-finder-bot"
          git config user.email "lead-finder-bot@users.noreply.github.com"
          git add data/leads.csv data/excluded.csv
          if git diff --cached --quiet; then
            echo "No new leads to save."
          else
            git commit -m "Weekly lead update: ${{ steps.find.outputs.new_count }} new"
            git push
          fi
      - name: Ping my phone
        if: steps.find.outputs.new_count != '0'
        env:
          ALERT_TARGET: ${{ secrets.ALERT_TARGET }}
          ALERT_CLICK_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/data/leads.csv
          NEW_COUNT: ${{ steps.find.outputs.new_count }}
        run: python3 leadfinder/notify.py "$NEW_COUNT new businesses without a website near you"

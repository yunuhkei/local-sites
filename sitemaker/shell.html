<script>
(function () {
  var rows = document.querySelectorAll('.hours tr[data-day]');
  var today = new Date().getDay();
  for (var i = 0; i < rows.length; i++) {
    if (Number(rows[i].getAttribute('data-day')) === today) {
      rows[i].className = 'today';
      rows[i].setAttribute('aria-current', 'date');
    }
  }
})();
</script>

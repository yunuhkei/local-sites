<main id="main">

    <p class="kicker">{{kicker}}</p>
    <h1 class="poster">{{hero_lines_html}}</h1>
    <p class="lede">{{headline}}</p>
    <p class="actions">
      <a class="btn btn-main" href="{{tel_href}}">Call {{phone}}</a>

  {{credit_html}}
</footer>

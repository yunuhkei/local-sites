<main id="main">
  <header class="masthead" id="top">
    <p class="folio"><span>{{kicker}}</span></p>
    <h1 class="ed">{{hero_lines_html}}</h1>
    <p class="stand">{{headline}}</p>
    <p class="actions">
      <a class="btn btn-main" href="{{tel_href}}">Call {{phone}}</a>
      <a class="btn btn-alt" href="{{map_href}}" target="_blank" rel="noopener">Directions</a>
    </p>
  </header>
  <div class="sections">
{{sections}}
  </div>
</main>
<footer class="foot">
  <p>{{name}} &middot; {{address}}</p>
  {{credit_html}}
</footer>
